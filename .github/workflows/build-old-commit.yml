name: Build Moon-light APK

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Enter the commit SHA to build'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          java -Xmx64m -Xms64m \
            -classpath gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moon-light-${{ inputs.commit_sha }}-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
