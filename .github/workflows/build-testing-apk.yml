name: Build Testing APK

# Builds a signed RELEASE apk (no debug apk) from the "Testing" branch.
# - Signed with a SEPARATE testing key (TESTING_* secrets), not the live key.
# - Gets its own package name (com.scell.moonlight.testing) and the label
#   "Moonlight Testing", so it installs side by side with the live app.
#
# Publishes a GitHub Release for every push, tagged "testing-<run number>" so one
# test build never overwrites another even when version.js wasn't bumped. The
# Release is marked PRE-RELEASE: it shows on the repo's Releases page for anyone
# to download by hand, but GET /releases/latest (what AppUpdater.kt polls) always
# skips pre-releases, so the live app's in-app updater never sees a test build.
# The apk is also kept as a run Artifact, same as before.

on:
  push:
    branches: [ Testing ]
  workflow_dispatch: {}

# A newer push to Testing cancels a build that is still running.
concurrency:
  group: build-testing-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the pre-release GitHub Release (last step).
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing key from GitHub secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.TESTING_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TESTING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.TESTING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TESTING_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the testing key from GitHub secrets."
          else
            echo "::warning::TESTING_* signing secrets are not set - building with the default debug key."
          fi

      - name: Build release APK
        env:
          APP_ID_SUFFIX: .testing
          APP_LABEL: Moonlight Testing
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload testing release APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-testing-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Tag includes the run number so every push gets its own Release, even when
      # version.js wasn't bumped between test builds. --prerelease keeps it out of
      # GET /releases/latest, so AppUpdater.kt (the live app's updater) never sees it.
      - name: Publish pre-release GitHub Release (for manual testing downloads only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oE "APP_VERSION = 'v[0-9]+\.[0-9]+\.[0-9]+" app/src/main/assets/version.js | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" || true)
          TAG="testing-${VER:-build}-${{ github.run_number }}"
          APK="moonlight-testing-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" --target "${{ github.sha }}" --prerelease \
            --title "Moonlight Testing ${VER:+$VER }(build ${{ github.run_number }})" \
            --notes "Test build from commit ${{ github.sha }} on Testing. Not used by the in-app updater."
