name: Build Testing APK

# Builds a signed RELEASE apk (no debug apk) from the "Testing" branch.
# - Signed with a SEPARATE testing key (TESTING_* secrets), not the live key.
# - Gets its own package name (com.scell.moonlight.testing) and the label
#   "Moonlight Testing", so it installs side by side with the live app.
# It does NOT publish a GitHub Release, so the in-app updater (which reads the
# newest Release) never sees test builds. Download the apk from the run's Artifacts.

on:
  push:
    branches: [ Testing ]
  workflow_dispatch: {}

# A newer push to Testing cancels a build that is still running.
concurrency:
  group: build-testing-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing key from GitHub secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.TESTING_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TESTING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.TESTING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TESTING_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the testing key from GitHub secrets."
          else
            echo "::warning::TESTING_* signing secrets are not set - building with the default debug key."
          fi

      - name: Build release APK
        env:
          APP_ID_SUFFIX: .testing
          APP_LABEL: Moonlight Testing
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload testing release APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-testing-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
